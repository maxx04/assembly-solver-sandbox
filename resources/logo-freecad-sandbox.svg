<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Sandbox-Start-Icon (Agent-Diagnose-Build, /home/maxx/freecad/install-claude-sandbox) -
       bewusst NICHT das normale FreeCAD-Logo, damit die beiden Starter im Menue/Desktop auf
       den ersten Blick unterscheidbar sind (Verwechslungsgefahr war der Ausloeser des
       ABI-Vorfalls vom 2026-08-28). Motiv: Laborkolben (Test-/Experimentalbau) in Orange/Amber
       statt FreeCADs Blau-Rot. -->
  <defs>
    <linearGradient id="flaskgrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFC24A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E2861A;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" fill="white" opacity="0"/>

  <!-- Kolbenhals -->
  <rect x="27" y="6" width="10" height="16" fill="#B0B0B0" stroke="#6E6E6E" stroke-width="1"/>

  <!-- Kolbenkoerper (Dreieck/Kegel) -->
  <path d="M 27 20 L 12 52 A 6 6 0 0 0 18 58 H 46 A 6 6 0 0 0 52 52 L 37 20 Z"
        fill="#DCE6EC" stroke="#6E6E6E" stroke-width="1.5"/>

  <!-- Fluessigkeit (Diagnose-Build, orange) -->
  <path d="M 20 38 L 12 52 A 6 6 0 0 0 18 58 H 46 A 6 6 0 0 0 52 52 L 44 38 Z"
        fill="url(#flaskgrad)" opacity="0.9"/>

  <!-- Blasen -->
  <circle cx="30" cy="47" r="2.4" fill="#FFF4DE" opacity="0.85"/>
  <circle cx="37" cy="51" r="1.7" fill="#FFF4DE" opacity="0.85"/>
  <circle cx="33" cy="54" r="1.3" fill="#FFF4DE" opacity="0.7"/>

  <!-- Stopfen -->
  <rect x="26" y="3" width="12" height="4" rx="1" fill="#6E6E6E"/>
</svg>
